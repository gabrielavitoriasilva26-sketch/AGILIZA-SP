<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Styles/Eu.css">
    <title>Eu</title>
</head>
<body>
    <header class="topo">
        <a href="./Home.html" class="voltar">← Voltar</a>
        <div class="foto-perfil">
            <img src="./Imagens/User.png" alt="user">
        </div>
        <h1>Prof João</h1>
        <p>professor@escola.com</p>
    </header>

    <main class="container">
        <section class="estatisticas">
            <div class="titulo-card">
                <img src="./Imagens/estatisticas.png" alt=" gráfico">
                <h2>Estatísticas</h2>
            </div>

            <div class="cards-estatisticas">
                <div class="card azul">
                    <img src="./Imagens/agenda.png" alt="agenda">
                    <p>0</p>
                    <span>Agendamentos Ativos</span>
                </div>

                <div class="card verde">
                    <img src="./Imagens/agenda.png" alt="agenda">
                    <p>4</p>
                    <span>Total de Reservas</span>
                </div>
            </div>
        </section>

        <section class="informacoes">
            <div class="titulo-card">
                <img src="./Imagens/User.png" alt="user">
                <h2>Informações do Perfil</h2>
            </div>

            <div class="item-info">
                <img src="./Imagens/usuario.png" alt=" usuário">
                <div>
                    <h3>Nome Completo</h3>
                    <p>João Silva</p>
                </div>
            </div>

            <div class="item-info">
                <img src="./Imagens/email.png" alt="email">
                <div>
                    <h3>Email</h3>
                    <p>professor@escola.com</p>
                </div>
            </div>

            <div class="item-info">
                <img src="./Imagens/usuario.png" alt="Ícone de usuário">
                <div>
                    <h3>Tipo de Usuário</h3>
                    <p>Professor</p>
                </div>
            </div>
        </section>

        <section class="configuracoes">
            <div class="titulo-card">
                <img src="./Imagens/configuracao.png" alt="Ícone de configuração">
                <h2>Configurações</h2>
            </div>

            <div class="item-config">
                <div>
                    <img src="./Imagens/notificacao.png" alt="Ícone de notificação">
                    <span>Notificações</span>
                </div>

                <label class="switch">
                    <input type="checkbox" checked>
                    <span></span>
                </label>
            </div>

            <div class="item-config">
                <div>
                    <img src="./Imagens/privacidade.png" alt="Ícone de privacidade">
                    <span>Privacidade</span>
                </div>

                <label class="switch">
                    <input type="checkbox" checked>
                    <span></span>
                </label>
            </div>
        </section>
        <a href="./index.html" class="btn-sair">
        Sair da Conta
        <img src="./Imagens/sair.png" alt="sair">
        </a>

    </main>
     <footer class="rodape">

        <a href="./Home.html" class="item_rodape">
            <img src="./Imagens/Home.png" alt="home">
            <p>Home</p>
        </a>

        <a href="./Novo.html" class="item_rodape">
            <img src="./Imagens/agenda.png" alt="agenda">
            <p>Agenda</p>
        </a>

        <a href="./Meus.html" class="item_rodape">
            <img class="img_fundo" src="./Imagens/agenda.png" alt="Meus">
            <img class="img_sobreposicao" src="./Imagens/Check.png" alt="check">
            <p>Meus</p>
        </a>

        <a href="./Eu.html" class="item_rodape">
            <img src="./Imagens/User.png" alt="Eu">
            <p>Eu</p>
        </a>

    </footer>

</body>
</html>
