<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/home.css">
    <title>Home</title>
</head>

<body>

    <header class="topo">
        <div class="conteudo">
            <div class="logo">
                <img src="./Imagens/compuatador.png" alt="computador">

            <p class="data" id="data-atual"></p>

    <main class="principal">

        <div class="botoes">

            <a href="./Meus.html" class="botao_link">

                    <h3>Carrinho 1</h3>
                    <p>10/03 às 07:30</p>

        </div>

    <footer class="rodape">

        <a href="./Home.html" class="item_rodape">
            <img src="./Imagens/Home.png" alt="home">
            <p>Home</p>
        </a>

        <a href="#" class="item_rodape">
            <img src="./Imagens/agenda.png" alt="agenda">
            <p>Agenda</p>
        </a>

        <a href="./Meus.html" class="item_rodape">
            <img class="img_fundo" src="./Imagens/agenda.png" alt="Meus">
            <img class="img_sobreposicao" src="./Imagens/Check.png" alt="check">
            <p>Meus</p>
        </a>

        <a href="#" class="item_rodape">
            <img src="./Imagens/User.png" alt="Eu">

        </a>

    <script src="./script.js"></script>
