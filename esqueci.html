<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Styles/styles.css">
    <title>Recuperar senha</title>
</head>

<body>

    <div class="container">
        <img class="imagem" src="./Imagens/Ellipse 1.png" alt="Logo">
        <h2 class="senha">Esqueceu sua senha?</h2>
        <div class="login">
            <h2 class="login__titulo">Recuperar senha</h2>
            <label class="login__label">
                Digite seu email
            </label>
            <input
                class="login__input"
                type="email"
                placeholder="Seu email"
            >
            <button class="login__botao">Enviar</button>
            <a class="login__link" href="./index.html">
                Voltar ao login
            </a>
        </div>

        <footer>
            <p>&copy; 2026 FACILITA SP</p>
        </footer>

    </div>

</body>
</html>
